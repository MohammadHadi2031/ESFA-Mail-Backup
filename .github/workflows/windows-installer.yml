name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Read version
        id: version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION file does not contain a plain x.y.z version: '$version'"
          }
          # On a tag push (v1.2.3), the tag and the VERSION file must agree, so a forgotten
          # version bump fails the build instead of silently shipping the wrong number.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($tagVersion -ne $version) {
              throw "Tag v$tagVersion does not match VERSION file ($version)."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build application
        run: python -m PyInstaller EsfaMailBackup.spec --noconfirm

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ESFA-Mail-Backup-Setup-v${{ steps.version.outputs.version }}
          path: Output/ESFA-Mail-Backup-Setup.exe
          if-no-files-found: error
